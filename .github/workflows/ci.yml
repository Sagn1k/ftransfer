name: CI

on:
  push:
  pull_request:

jobs:
  smoke:
    name: Server smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run smoke tests
        run: tests/smoke.sh

  build-app:
    name: Build macOS menu bar app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build FTransfer.app
        run: clients/mac/build.sh
